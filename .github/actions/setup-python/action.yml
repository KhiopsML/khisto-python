name: Set up secure Python tooling
description: Install patched TLS clients without reusing dependency caches
inputs:
  python-version:
    description: Python version to install
    default: '3.13'
outputs:
  python-path:
    description: Path to the bootstrapped Python interpreter
    value: ${{ steps.python.outputs.python-path }}
runs:
  using: composite
  steps:
    - name: Refresh Linux system certificates
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --only-upgrade ca-certificates
    - name: Distrust the compromised Windows root
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $removed = 0
        foreach ($path in 'Cert:\LocalMachine\Root', 'Cert:\LocalMachine\CA', 'Cert:\CurrentUser\Root', 'Cert:\CurrentUser\CA') {
          $certificates = @(Get-ChildItem -LiteralPath $path |
            Where-Object { $_.GetNameInfo('SimpleName', $false) -eq 'emSign ECC Root CA - G3' })
          foreach ($certificate in $certificates) {
            Write-Host "Distrusting emSign ECC Root CA - G3: $($certificate.Thumbprint)"
            $store = [System.Security.Cryptography.X509Certificates.X509Store]::new('Disallowed', 'LocalMachine')
            try {
              $store.Open('ReadWrite')
              $store.Add($certificate)
            } finally {
              $store.Close()
            }
            Remove-Item -LiteralPath $certificate.PSPath -Force
            $removed++
          }
        }
        Write-Host "Removed $removed compromised root entries"
    - name: Distrust the compromised macOS root
      if: runner.os == 'macOS'
      shell: bash
      run: |
        certificate="$RUNNER_TEMP/emsign-g3.pem"
        if security find-certificate -c "emSign ECC Root CA - G3" -p /System/Library/Keychains/SystemRootCertificates.keychain > "$certificate"; then
          openssl x509 -in "$certificate" -noout -subject -fingerprint -sha256
          sudo security add-trusted-cert -d -r deny -k /Library/Keychains/System.keychain "$certificate"
        else
          status=$?
          if [ "$status" -ne 44 ]; then
            exit "$status"
          fi
          echo "emSign ECC Root CA - G3 is already absent from the macOS system roots"
        fi
    - uses: actions/setup-python@v5
      id: python
      with:
        python-version: ${{ inputs.python-version }}
        check-latest: true
    - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      with:
        version: '0.13.5'
        enable-cache: false
    - name: Bootstrap patched pip and certificates using patched uv
      shell: bash
      run: |
        uv --no-cache pip install --system --python python "pip==26.2.2" "certifi==2026.10.19"
        python - <<'PY'
        import os
        from pathlib import Path

        import certifi

        bundle = Path(certifi.where()).as_posix()
        with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as environment:
            for name in ("SSL_CERT_FILE", "REQUESTS_CA_BUNDLE", "CURL_CA_BUNDLE", "GIT_SSL_CAINFO"):
                environment.write(f"{name}={bundle}\n")
            environment.write(f"SSL_CERT_DIR={Path(bundle).parent.as_posix()}\n")
        PY

name: pip packaging

on:
  workflow_dispatch:
    inputs:
      python_repository:
        description: python repository
        type: choice
        default: None  # no publishing to any Package Index by default
        options: [None, testpypi, pypi]
      signature-activation:
        type: boolean
        default: false
        description: Sign khisto binary
  push:
    tags: ['*']
  pull_request:
    paths:
      - .github/workflows/pack-pip.yaml
      - .github/actions/setup-python/**
      - scripts/check-tls-tools.py
      - pyproject.toml
      - uv.lock
      - CMakeLists.txt

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash
env:
  KEYPAIR: KP_Khiops_HSM
  UV_NO_CACHE: '1'
  PIP_NO_CACHE_DIR: '1'

jobs:
  check-publisher:
    name: Check publisher TLS clients
    runs-on: ubuntu-latest
    env:
      # Do not supplement the patched bundle with the image's older system roots.
      SSL_CERT_FILE: /root/.local/lib/python3.13/site-packages/certifi/cacert.pem
      SSL_CERT_DIR: /root/.local/lib/python3.13/site-packages/certifi
      REQUESTS_CA_BUNDLE: /root/.local/lib/python3.13/site-packages/certifi/cacert.pem
    steps:
      - uses: actions/checkout@v6
      - name: Verify the audited publisher image and its active TLS clients
        env:
          DIGEST: ghcr.io/pypa/gh-action-pypi-publish@sha256:411241df99067c98b6d08fd8e26d14e86740a22460599c2af571e6dc26e27ffc
        run: |
          docker pull "$DIGEST"
          docker run --rm --entrypoint python -e SSL_CERT_FILE -e SSL_CERT_DIR -e REQUESTS_CA_BUNDLE -v "$PWD/scripts:/checks:ro" "$DIGEST" /checks/check-tls-tools.py certifi sigstore system

  build-wheel:
    name: Build wheel
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, windows-2025-vs2026, windows-11-vs2026-arm, macos-15-intel, macos-15]
    env:
      SIGN_WINDOWS_WHEELS: ${{ github.event_name == 'workflow_dispatch' && inputs.signature-activation }}
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-python
        id: python

      - name: Load Visual C++ Environment Variables (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          call "C:\\Program Files\\Microsoft Visual Studio\\18\\Enterprise\\VC\\Auxiliary\\Build\\vcvars64.bat"
          set >> %GITHUB_ENV%

      - name: Build wheels
        uses: pypa/cibuildwheel@b9e566a2b284570af229f6c2a33673410d0389a3 # v4.3.4
        with:
          python-path: ${{ steps.python.outputs.python-path }}

      - name: Test built wheel
        env:
          UV_PROJECT_ENVIRONMENT: .test-env
        run: |
          uv sync --frozen --group dev --extra all --no-install-project
          uv pip install --python .test-env wheelhouse/khisto-*.whl
          uv run --no-sync python -c 'import khisto, tomllib; expected = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]; assert khisto.__version__ == expected; print(khisto.__version__, khisto.__file__)'
          uv run --no-sync python scripts/check-tls-tools.py certifi
          uv run --no-sync pytest tests/ --no-cov

      # Windows wheels are unpackad, signed and repacked before uploading
      - name: Set SIGN_X64_WHEEL flag
        if: runner.os == 'Windows' && runner.arch == 'X64'
        run: echo "SIGN_X64_WHEEL=${{ env.SIGN_WINDOWS_WHEELS }}" >> "$GITHUB_ENV"
      - name: Warn smctl does not support ARM64 yet
        if: runner.os == 'Windows' && runner.arch == 'ARM64' && env.SIGN_WINDOWS_WHEELS == 'true'
        run: echo "::warning::smctl does not support ARM64 yet; the ARM64 wheel will not be signed"
      - name: Install wheel package for signing
        if: env.SIGN_X64_WHEEL == 'true'
        run: uv pip install --system --python python wheel
      - name: Unpack khisto wheel
        if: env.SIGN_X64_WHEEL == 'true'
        run: |
          mkdir -p wheelhouse/unpacked
          python -m wheel unpack wheelhouse/khisto-*.whl --dest wheelhouse/unpacked
      - name: Setup SM_CLIENT_CERT_FILE from base64 secret data
        if: env.SIGN_X64_WHEEL == 'true'
        run: |
          echo "SM_CLIENT_CERT_FILE=D:\\Certificate_pkcs12.p12" >> "$GITHUB_ENV"
          echo "${{ secrets.SM_CLIENT_CERT_FILE_B64 }}" | base64 --decode > /d/Certificate_pkcs12.p12
      - name: Sign unpacked wheel binaries
        if: env.SIGN_X64_WHEEL == 'true'
        uses: digicert/code-signing-software-trust-action@v1.2.1
        with:
          input: wheelhouse/unpacked/
          keypair-alias: ${{ env.KEYPAIR }}
          simple-signing-mode: true
        env:
          SM_HOST: ${{ secrets.SM_HOST }}
          SM_API_KEY: ${{ secrets.SM_API_KEY }}
          SM_CLIENT_CERT_PASSWORD: ${{ secrets.SM_CLIENT_CERT_PASSWORD }}
      - name: Repack signed wheels
        if: env.SIGN_X64_WHEEL == 'true'
        run: |
          rm wheelhouse/khisto-*.whl
          python -m wheel pack wheelhouse/unpacked/khisto-* --dest-dir wheelhouse
      - uses: actions/upload-artifact@v7
        with:
          name: pkg-wheel-${{ matrix.os }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  release-testpypi:
    # Publish only on tag pushes in the KhiopsML repository
    if: github.ref_type == 'tag' && github.repository_owner == 'KhiopsML' && inputs.python_repository == 'testpypi'
    name: Publish to Test.PyPI.org
    needs: [build-wheel, check-publisher]
    runs-on: ubuntu-latest
    env:
      SSL_CERT_FILE: /root/.local/lib/python3.13/site-packages/certifi/cacert.pem
      SSL_CERT_DIR: /root/.local/lib/python3.13/site-packages/certifi
      REQUESTS_CA_BUNDLE: /root/.local/lib/python3.13/site-packages/certifi/cacert.pem
    permissions:
      id-token: write
    environment:
      name: testpypi
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: pkg-*
          path: dist
          merge-multiple: true
      # Use exactly the official image inspected by check-publisher.
      - uses: docker://ghcr.io/pypa/gh-action-pypi-publish@sha256:411241df99067c98b6d08fd8e26d14e86740a22460599c2af571e6dc26e27ffc
        env:
          INPUT_USER: __token__
          INPUT_PASSWORD: ''
          INPUT_REPOSITORY_URL: https://test.pypi.org/legacy/
          INPUT_PACKAGES_DIR: dist
          INPUT_VERIFY_METADATA: 'true'
          INPUT_SKIP_EXISTING: 'false'
          INPUT_VERBOSE: 'true'
          INPUT_PRINT_HASH: 'true'
          INPUT_ATTESTATIONS: 'true'

  release-pypi:
    # Publish only on tag pushes in the KhiopsML repository
    name: Publish to PyPI.org
    if: github.ref_type == 'tag' && github.repository_owner == 'KhiopsML' && inputs.python_repository == 'pypi'
    needs: [build-wheel, check-publisher]
    runs-on: ubuntu-latest
    env:
      SSL_CERT_FILE: /root/.local/lib/python3.13/site-packages/certifi/cacert.pem
      SSL_CERT_DIR: /root/.local/lib/python3.13/site-packages/certifi
      REQUESTS_CA_BUNDLE: /root/.local/lib/python3.13/site-packages/certifi/cacert.pem
    permissions:
      id-token: write
    environment:
      name: pypi
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: pkg-*
          path: dist
          merge-multiple: true
      - uses: docker://ghcr.io/pypa/gh-action-pypi-publish@sha256:411241df99067c98b6d08fd8e26d14e86740a22460599c2af571e6dc26e27ffc
        env:
          INPUT_USER: __token__
          INPUT_PASSWORD: ''
          INPUT_REPOSITORY_URL: https://upload.pypi.org/legacy/
          INPUT_PACKAGES_DIR: dist
          INPUT_VERIFY_METADATA: 'true'
          INPUT_SKIP_EXISTING: 'false'
          INPUT_VERBOSE: 'true'
          INPUT_PRINT_HASH: 'true'
          INPUT_ATTESTATIONS: 'true'
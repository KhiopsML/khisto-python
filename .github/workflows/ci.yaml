name: Lint and Test

on:
  pull_request:
    paths:
      - .github/workflows/ci.yaml
      - pyproject.toml
      - scripts/check-base-install.py
      - scripts/diagnose-emudhra.py
      - scripts/get-python-versions.py
      - src/**
      - tests/**

defaults:
  run:
    shell: bash

# Do not let uv fall back to a Python installed by the runner image.
env:
  UV_PYTHON_PREFERENCE: only-managed

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: false
          version: "0.13.5"
          python-version: "3.13"

      - name: Check package client version (eMudhra)
        run: uv run --no-project scripts/diagnose-emudhra.py

      - name: Install dev dependencies
        run: uv sync --group dev

      - name: Run pre-commit hooks
        run: uv run pre-commit run --all-files

  test-base-install:
    name: Test base install without Matplotlib
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: false
          version: "0.13.5"
          python-version: "3.13"

      - name: Check package client version (eMudhra)
        run: uv run --no-project scripts/diagnose-emudhra.py

      - name: Test base API without optional dependencies
        run: uv run --isolated --no-project --with . python scripts/check-base-install.py

  get-python-versions:
    name: Get Python versions
    runs-on: ubuntu-latest
    outputs:
      python-versions: ${{ steps.versions.outputs.python-versions }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: false
          version: "0.13.5"
          python-version: "3.13"

      - name: Check package client version (eMudhra)
        run: uv run --no-project scripts/diagnose-emudhra.py

      - name: Discover available Python versions
        id: versions
        run: uv run --no-project scripts/get-python-versions.py

  test:
    name: Test (Python ${{ matrix.python-version }})
    needs: get-python-versions
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJson(needs.get-python-versions.outputs.python-versions) }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: false
          python-version: ${{ matrix.python-version }}
          version: "0.13.5"

      - name: Check package client version (eMudhra)
        run: uv run --no-project scripts/diagnose-emudhra.py

      - name: Install dev dependencies
        run: uv sync --group dev --extra all

      - name: Run tests
        run: uv run pytest

name: Lint and Test

on:
  pull_request:
    paths:
      - .github/workflows/ci.yaml
      - pyproject.toml
      - scripts/check-base-install.py
      - scripts/diagnose-emudhra.py
      - src/**
      - tests/**

defaults:
  run:
    shell: bash

env:
  UV_PYTHON_PREFERENCE: only-managed

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: false
          version: "0.13.5"
          python-version: "3.13"

      - name: Check package client version (eMudhra)
        run: uv run --no-project python scripts/diagnose-emudhra.py

      - name: Install dev dependencies
        run: uv sync --group dev

      - name: Run pre-commit hooks
        run: uv run pre-commit run --all-files

  test-base-install:
    name: Test base install without Matplotlib
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: false
          version: "0.13.5"
          python-version: "3.13"

      - name: Check package client version (eMudhra)
        run: uv run --no-project python scripts/diagnose-emudhra.py

      - name: Test base API without optional dependencies
        run: uv run --isolated --no-project --with . python scripts/check-base-install.py

  get-python-versions:
    name: Get Python versions
    runs-on: ubuntu-latest
    outputs:
      python-versions: ${{ steps.versions.outputs.python-versions }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: false
          version: "0.13.5"
          python-version: "3.13"

      - name: Check package client version (eMudhra)
        run: uv run --no-project python scripts/diagnose-emudhra.py

      - name: Discover available Python versions
        id: versions
        run: |
          min_ver=$(uv run --no-project python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['requires-python'])")
          versions=$(
            uv python list --all-versions "$min_ver" \
              | grep -oP 'cpython-\K\d+\.\d+(?=\.\d+-)'  \
              | sort -uV \
              | uv run --no-project python -c "import sys, json; print(json.dumps(sys.stdin.read().split()))"
          )
          echo "python-versions=$versions" >> $GITHUB_OUTPUT

  test:
    name: Test (Python ${{ matrix.python-version }})
    needs: get-python-versions
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJson(needs.get-python-versions.outputs.python-versions) }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: false
          python-version: ${{ matrix.python-version }}
          version: "0.13.5"

      - name: Check package client version (eMudhra)
        run: uv run --no-project python scripts/diagnose-emudhra.py

      - name: Install dev dependencies
        run: uv sync --group dev --extra all

      - name: Run tests
        run: uv run pytest

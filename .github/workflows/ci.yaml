name: Lint and Test

on:
  pull_request:
    paths:
      - .github/workflows/ci.yaml
      - .github/actions/setup-python/**
      - pyproject.toml
      - uv.lock
      - scripts/check-base-install.py
      - scripts/check-tls-tools.py
      - src/**
      - tests/**

defaults:
  run:
    shell: bash

env:
  UV_NO_CACHE: '1'
  PIP_NO_CACHE_DIR: '1'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-python

      - name: Install dev dependencies
        run: uv sync --frozen --group dev

      - name: Run pre-commit hooks
        run: uv run --frozen pre-commit run --all-files

  test-base-install:
    name: Test base install without Matplotlib
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-python

      - name: Test base API without optional dependencies
        run: uv run --isolated --no-project --with . python scripts/check-base-install.py

  get-python-versions:
    name: Get Python versions
    runs-on: ubuntu-latest
    outputs:
      python-versions: ${{ steps.versions.outputs.python-versions }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-python

      - name: Discover available Python versions
        id: versions
        run: |
          min_ver=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['requires-python'])")
          versions=$(
            uv python list --all-versions "$min_ver" \
              | grep -oP 'cpython-\K\d+\.\d+(?=\.\d+-)'  \
              | sort -uV \
              | python3 -c "import sys, json; print(json.dumps(sys.stdin.read().split()))"
          )
          echo "python-versions=$versions" >> $GITHUB_OUTPUT

  test:
    name: Test (Python ${{ matrix.python-version }})
    needs: get-python-versions
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJson(needs.get-python-versions.outputs.python-versions) }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-python
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dev dependencies
        run: |
          uv sync --frozen --group dev --extra all
          uv run --frozen python scripts/check-tls-tools.py certifi

      - name: Run tests
        run: uv run --frozen pytest

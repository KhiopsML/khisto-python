name: Lint and Test

on:
  pull_request:
    paths:
      - .github/workflows/ci.yaml
      - pyproject.toml
      - scripts/check-base-install.py
      - src/**
      - tests/**

defaults:
  run:
    shell: bash

# Do not let uv fall back to a Python installed by the runner image.
env:
  UV_PYTHON_PREFERENCE: only-managed

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: false
          version: "0.13.7"
          python-version: "3.13"

      - name: Install dev dependencies
        run: uv sync --group dev

      - name: Run pre-commit hooks
        run: uv run pre-commit run --all-files

  test-base-install:
    name: Test base install without Matplotlib
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: false
          version: "0.13.7"
          python-version: "3.13"

      - name: Test base API without optional dependencies
        run: uv run --isolated --no-project --with . python scripts/check-base-install.py

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: false
          python-version: ${{ matrix.python-version }}
          version: "0.13.7"

      - name: Install dev dependencies
        run: uv sync --group dev --extra all

      - name: Run tests
        run: uv run pytest

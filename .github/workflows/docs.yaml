---
name: Docs
on:
  workflow_dispatch:
    inputs:
      deploy-gh-pages:
        description: Deploy to GH Pages
        required: true
        type: boolean
        default: false
  pull_request:
    types: [opened, reopened, synchronize, closed]
    paths:
      - docs/**
      - pyproject.toml
      - scripts/diagnose-emudhra.py
      - src/khisto/**/*.py
      - .github/workflows/docs.yaml
  push:
    tags: ['*']
# Keep default workflow permissions read-only; deployment jobs elevate explicitly.
permissions:
  contents: read
  packages: read
env:
  UV_PYTHON_PREFERENCE: only-managed
# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest
# queued. However, do NOT cancel in-progress runs as we want to allow these production deployments
# to complete.
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout khisto-python
        uses: actions/checkout@v4
      - name: Set up UV
        uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: false
          version: "0.13.5"
          python-version: "3.13"
      - name: Check package client version (eMudhra)
        run: uv run --no-project scripts/diagnose-emudhra.py
      - name: Install pandoc
        run: sudo apt-get install -y pandoc
      - name: Install doc build requirements
        run: uv sync --group docs
      - name: Build Sphinx Documentation
        run: uv run --directory docs make html
      - name: Upload the docs as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: khisto-python-docs
          path: ./docs/_build/html/
  preview:
    if: >-
      always() &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.action == 'closed' || needs.build.result == 'success')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout khisto-python
        uses: actions/checkout@v4
      - name: Download the docs artifact
        if: github.event.action != 'closed'
        uses: actions/download-artifact@v4
        with:
          name: khisto-python-docs
          path: ./docs/_build/html
      - name: Deploy PR preview
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: ./docs/_build/html
          preview-branch: gh-pages
          wait-for-pages-deployment: true
          qr-code: false
  # Publish production docs to GitHub Pages on manual request.
  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy-gh-pages == true
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout doc sources (to get the current environment)
        uses: actions/checkout@v4
      - name: Download the docs artifact
        uses: actions/download-artifact@v4
        with:
          name: khisto-python-docs
          path: ./docs/_build/html
      - name: Deploy web site
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: ./docs/_build/html
          branch: gh-pages
          clean-exclude: pr-preview
          force: false
